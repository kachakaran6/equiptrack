<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EquipTrack Administrative Control Console" />
    <title>EquipTrack — Admin Control Panel</title>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Zero-flash theme initialization -->
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('equiptrack-admin-theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && systemDark) || (storedTheme === 'system' && systemDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else if (storedTheme === 'light' || (storedTheme === 'system' && !systemDark)) {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/admin/assets/index-BdAhvtuv.js"></script>
    <link rel="stylesheet" crossorigin href="/admin/assets/index-BNq3r4KF.css">
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-indigo-500/20 selection:text-indigo-400">
    <div id="root"></div>
  </body>
</html>
