version: '3.9'

services:
  # ──────────────────────────────────────────
  # EquipTrack API (Production)
  # ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-365d}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Telegram backup credentials
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Backup configuration
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
      - BACKUP_TIMEZONE=${BACKUP_TIMEZONE:-Asia/Kolkata}
      - BACKUP_FORMAT=${BACKUP_FORMAT:-sql}
      - BACKUP_COMPRESSION=${BACKUP_COMPRESSION:-gzip}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────
  # PostgreSQL (Development/Staging only)
  # Use Coolify-managed PostgreSQL in production
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: equiptrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equiptrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  pgdata:
